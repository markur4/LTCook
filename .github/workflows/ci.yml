name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ltcook-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  profile:
    name: Select check profile
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.profile.outputs.versions }}
      extended: ${{ steps.profile.outputs.extended }}
    steps:
      - uses: actions/checkout@v5
        if: github.ref_type == 'tag' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        if: github.ref_type == 'tag' && github.event_name != 'workflow_dispatch'
        with:
          just-version: "1.56.0"
      - name: Install Python for stable tag evidence
        if: >-
          github.ref_type == 'tag' && github.event_name != 'workflow_dispatch' &&
          !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: false
      - id: profile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          versions='["3.13"]'
          extended=false
          version='(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            extended=true
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v${version}b[1-9][0-9]*$ ]]; then
              require_ci="$(just _committed-release-policy HEAD RELEASE_REQUIRE_CI)"
              if [[ "$require_ci" == false ]]; then
                versions='[]'
              fi
            elif [[ "$GITHUB_REF_NAME" =~ ^v${version}rc[1-9][0-9]*$ ]] ||
                 { [[ "$GITHUB_REF_NAME" =~ ^v${version}$ ]] &&
                   ! PYTHONPATH=src uv run --no-project --python 3.13 python \
                     -m ltcook_dev.packaging.release_assets reuse-rc \
                     --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"; }; then
              extended=true
            fi
          fi
          if [[ "$extended" == true ]]; then
            versions='["3.13","3.14"]'
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "extended=$extended" >> "$GITHUB_OUTPUT"

  checks:
    needs: profile
    if: needs.profile.outputs.versions != '[]'
    name: Linux / Python ${{ matrix.python-version }} quick checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.profile.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install locked dependencies without building the Python app
        run: |
          bun install --frozen-lockfile
          uv sync --locked --all-groups --no-install-project
      - name: Type-check JavaScript workspaces and evaluation scripts
        if: matrix.python-version == '3.13'
        run: bun run check
      - name: Run quick JavaScript contracts
        if: matrix.python-version == '3.13'
        run: bun run test
      - name: Build runtime, plugins, and teams
        if: matrix.python-version == '3.13' && needs.profile.outputs.extended == 'true'
        run: bun run build
      - name: Build the bundled Paseo web app
        if: matrix.python-version == '3.13' && needs.profile.outputs.extended == 'true'
        run: bun run build:paseo-web
      - name: Stage canonical runtime archive
        if: matrix.python-version == '3.13' && needs.profile.outputs.extended == 'true'
        run: PYTHONPATH=src uv run --locked --no-sync python -m ltcook_dev.packaging.package_assets --root . --destination src/ltcook_distr/bundle.zip
      - name: Install staged Python application and build packages
        if: matrix.python-version == '3.13' && needs.profile.outputs.extended == 'true'
        run: |
          uv sync --locked --all-groups
          uv build --no-sources --no-build-logs
      - name: Check Python formatting and lint
        if: matrix.python-version == '3.13'
        run: |
          uv run --locked --no-sync ruff format --check src tests
          uv run --locked --no-sync ruff check src tests
      - name: Type-check Python sources
        if: matrix.python-version == '3.13'
        run: uv run --locked --no-sync pyright
      - name: Run quick Python tests
        env:
          PYTHONPATH: src
          NO_COLOR: "1"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run --locked --no-sync pytest -m 'not integration and not system'
      - name: Compile Python sources
        if: matrix.python-version == '3.13'
        run: uv run --locked --no-sync python -m compileall -q src tests

  clockwork-system:
    needs: profile
    if: needs.profile.outputs.extended == 'true'
    name: Linux / real Pi and Paseo clockwork acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: auto
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked --all-groups --no-install-project
      - name: Build native Pi entry point
        run: bun run build
      - name: Install evaluation sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Exercise offline native scheduling and recovery
        run: PYTHONPATH=src uv run --locked --no-sync pytest -q tests/python/system/test_clockwork_acceptance.py
      - name: Install Linux browser for native GUI acceptance
        run: node node_modules/agent-browser/bin/agent-browser.js install --with-deps
      - name: Build pinned Paseo web patch
        run: bun run build:paseo-web
      - name: Exercise native Paseo GUI at desktop and mobile widths
        run: PYTHONPATH=src uv run --locked --no-sync pytest -q tests/python/system/test_paseo_gui_acceptance.py

  slow-integration:
    name: Slow integration and system checks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: auto
      - name: Install locked dependencies without the staged Python app
        run: |
          bun install --frozen-lockfile
          uv sync --locked --all-groups --no-install-project
      - name: Run explicit integration checks
        run: PYTHONPATH=src uv run --locked --no-sync pytest -m integration
      - name: Run explicit system checks
        run: |
          PYTHONPATH=src uv run --locked --no-sync pytest -m system \
            --ignore=tests/python/system/test_clockwork_acceptance.py \
            --ignore=tests/python/system/test_paseo_gui_acceptance.py

  native-platforms:
    name: Native ${{ matrix.os }} quick checks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install locked dependencies without the staged Python app
        run: |
          bun install --frozen-lockfile
          uv sync --locked --all-groups --no-install-project
      - name: Type-check and run quick contracts on native host
        shell: bash
        run: |
          bun run check
          bun run test
          PYTHONPATH=src uv run --locked --no-sync pytest -m 'not integration and not system'
