name: Build release assets

run-name: ${{ github.actor }} - manual LTCook asset build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux wheel, source archive, and installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build wheel, source archive, and staged runtime bundle
        run: just build
      - name: Generate AppRC installer artifacts
        run: just make-artifacts
      - name: Fetch official PyApp source
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ofek/pyapp/releases/download/v0.31.0/source.tar.gz \
            --output pyapp-source.tar.gz
          mkdir pyapp-source
          tar -xzf pyapp-source.tar.gz --strip-components=1 -C pyapp-source
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build PyApp installer launcher
        run: |
          set -- dist/*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one wheel in dist/" >&2
            exit 1
          fi
          PYTHONPATH=src uv run --locked python \
            -m ltcook_dev.packaging.build_pyapp \
            --pyapp-source pyapp-source \
            --wheel "$1" \
            --output artifacts/ltcook-install

      - name: Upload checkout-independent build assets
        uses: actions/upload-artifact@v7
        with:
          name: ltcook-linux-assets-${{ github.sha }}
          path: |
            artifacts/*.whl
            dist/*.tar.gz
            artifacts/ltcook-install
            artifacts/main-installer.pyz
          if-no-files-found: error
          retention-days: 14
