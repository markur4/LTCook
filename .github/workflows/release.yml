name: Build release assets

run-name: ${{ github.actor }} - manual LTCook Linux asset build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux wheel, source archive, and native setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Python and pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          version: "0.13.6"
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Build wheel, source archive, and canonical runtime bundle
        run: |
          bun install --frozen-lockfile
          just build
      - name: Build Linux native setup from this commit
        run: PYTHONPATH=src uv run --locked python -m ltcook_distr.build_native --revision "$GITHUB_SHA" --uv "$(command -v uv)"
      - name: Stage exact release assets and schema-two manifest
        run: just stage-release-assets "v$(uv version --short)" "$GITHUB_SHA"
      - name: Verify native checksum
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: ltcook-linux-assets-${{ github.sha }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 14
