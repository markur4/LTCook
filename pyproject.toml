[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltcook"
version = "0.1.0"
description = "A Paseo-backed agent runtime with coordinated interchangeable teams."
authors = [{ name = "markur4" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "apprc-core==0.33.0",
    "apprc==0.33.0",
    "typer",
]

[project.urls]
Repository = "https://github.com/markur4/LTCook.git"

[dependency-groups]
dev = [
    "apprc-core[distribution]==0.33.0",
    "setuptools>=68",
    "pytest>=8.2",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
cmdclass = { build_py = "ltcook_dev.packaging.package_assets.BuildPy" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ltcook" = ["config/apprc.defaults.env"]
"ltcook_distr" = ["bundle/**/*", "bundle/.node-version"]

[tool.apprc.distribution]
app-id = "ltcook"
apprc-reference = "ltcook.config.app:APP_RC"
project-path = "."
distribution-path = "src/ltcook_distr"
launcher-command = "ltcook"

[project.scripts]
ltcook = "ltcook.main:main"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
    ".venv",
    "build",
    "dist",
    "**/__pycache__",
    "**/node_modules",
    "src/ltcook_distr/artifacts",
    "src/ltcook_distr/bundle",
    "src/ltcook_distr/payload/app_lifecycle/_support",
]

[tool.ruff]
line-length = 88

extend-exclude = [
    "src/ltcook_distr/artifacts",
    "src/ltcook_distr/bundle",
    "src/ltcook_distr/payload/app_lifecycle/_support",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires an explicitly prepared local integration environment",
    "system: slow end-to-end or installer checks with native prerequisites",
]
